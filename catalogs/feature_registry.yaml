      - "DAYS_EMPLOYED"
    formula_or_aggregation: "AGE_YEARS=-DAYS_BIRTH/365.25; EMPLOYED_YEARS=-DAYS_EMPLOYED/365.25; EMPLOYED_AGE_RATIO=DAYS_EMPLOYED/DAYS_BIRTH. Replace DAYS_EMPLOYED=365243 with NaN first."
    data_type: float32
    expected_direction: non_monotonic_to_be_tested
    missing_policy: "Preserve NaN and DAYS_EMPLOYED_ANOMALOUS indicator."
    outlier_policy: "No clipping in E02."
    leakage_risk: "low_for_public_application_time_fields"
    available_at_application_time: "Home Credit application table fields."
    permitted_for_modeling: true
    implementation_location: "src/credit_scoring/features/home_credit_application.py"
    documentation_path: "docs/features/home_credit_application_features.md"
