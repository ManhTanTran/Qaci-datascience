    description: "E02 application-level affordability and amount features."
    category: application
    source_columns:
      - "AMT_CREDIT"
      - "AMT_INCOME_TOTAL"
      - "AMT_ANNUITY"
      - "AMT_GOODS_PRICE"
      - "CNT_FAM_MEMBERS"
    formula_or_aggregation: "CREDIT_INCOME_RATIO=AMT_CREDIT/AMT_INCOME_TOTAL; ANNUITY_INCOME_RATIO=AMT_ANNUITY/AMT_INCOME_TOTAL; CREDIT_ANNUITY_RATIO=AMT_CREDIT/AMT_ANNUITY; GOODS_CREDIT_RATIO=AMT_GOODS_PRICE/AMT_CREDIT; CREDIT_GOODS_DIFF=AMT_CREDIT-AMT_GOODS_PRICE; INCOME_PER_PERSON=AMT_INCOME_TOTAL/CNT_FAM_MEMBERS. Zero or missing denominator returns NaN."
    data_type: float32
    expected_direction: non_monotonic_to_be_tested
    missing_policy: "Preserve NaN; safe division never emits infinity."
    outlier_policy: "No clipping without verified semantic bounds."
    leakage_risk: "low_for_public_application_time_fields"
    available_at_application_time: "Home Credit application table fields."
    permitted_for_modeling: true
    implementation_location: "src/credit_scoring/features/home_credit_application.py"
    factorial_implementation_location: "src/credit_scoring/features/home_credit_credit_amount_factorial.py"
    factorial_metadata: "N explicitly recomputes CREDIT_INCOME_RATIO, ANNUITY_INCOME_RATIO, GOODS_CREDIT_RATIO and INCOME_PER_PERSON; R adds CREDIT_ANNUITY_RATIO; D adds CREDIT_GOODS_DIFF. Disabling N preserves E01 columns exactly. E02-D robustness gate failed at 9/15 positive folds, so neither R nor D is promoted into E03-BASE."
