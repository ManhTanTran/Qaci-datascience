version: "1.0"
source:
  sheet_preference: Synthetic_Customers
  id_column: user_id
  expected_non_id_columns: 194
  note: >-
    Đây là mapping research cho workbook synthetic. Các cột cấp vùng giữ
    semantic_type contextual_proxy; không được diễn giải thành thuộc tính cá nhân.
fields:
  user_id:
    raw_columns: [user_id]
    transform: identity
    required: true
    semantic_type: identifier
    description: Mã khách hàng synthetic dùng để truy vết một dòng nguồn.
    missing_policy: reject_row
  age:
    raw_columns:
      - age
      - age_group
      - age_group_install
      - age_group_ord
      - gender
      - household_type
      - income_band_est
      - income_band_est_ord
    transform: build_age_demographics
    required: true
    semantic_type: direct_demographic
    description: Tuổi hoặc khoảng tuổi quan sát được; khoảng giao với ngưỡng vẫn là UNKNOWN.
    valid_range: [0, 120]
    missing_policy: preserve_missing
  local_context:
    raw_columns:
      - area_km2
      - population
      - population_density
      - population_growth_rate
      - avg_monthly_income
      - avg_grdp
      - avg_monthly_spend
      - poverty_rate
      - scoli
      - unemployment_rate
      - informal_employment_rate
      - labor_productivity
      - social_insurance_rate
      - unemployment_insurance_rate
      - health_insurance_rate
      - avg_housing_area
      - has_computer_rate
      - has_phone_rate
      - internet_penetration
      - household_internet_rate
    transform: build_local_context
    required: false
    semantic_type: contextual_proxy
    description: Chỉ báo kinh tế-xã hội của khu vực, không phải thu nhập hoặc chi tiêu cá nhân.
    unit: source_defined_but_unconfirmed
    missing_policy: preserve_missing
    validation_warning: "TODO(FPT): cần xác nhận với mentor hoặc data owner."
  location:
    raw_columns:
      - city
      - city_install
      - district
      - ward
      - has_install_address_data
      - has_install_address
      - install_matches_profile_city
      - install_address_completeness
    transform: build_location
    required: false
    semantic_type: direct_profile
    description: Địa chỉ hồ sơ và địa chỉ lắp đặt quan sát được.
    missing_policy: preserve_missing
  device_usage:
    raw_columns:
      - fplay_device_id_nunique_30D
      - fplay_device_id_count_30D
      - fplay_device_type_nunique_30D
