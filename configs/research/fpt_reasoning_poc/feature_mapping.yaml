      - fplay_RECENCY
      - fplay_is_multi_device
      - internet_device_id_nunique_30D
      - internet_device_id_count_30D
      - internet_device_type_nunique_30D
      - internet_device_id_nunique_90D
      - internet_device_id_count_90D
      - internet_device_type_nunique_90D
      - internet_device_id_nunique_180D
      - internet_device_id_count_180D
      - internet_device_type_nunique_180D
      - internet_device_id_nunique_ALL
      - internet_device_id_count_ALL
      - internet_device_type_nunique_ALL
      - internet_RECENCY
      - internet_is_multi_device
      - active_domain_count
      - available_domain_count
      - tenure_group
      - recency_group
      - app_count_group
      - app_tenure_group
      - app_recency_days
      - active_domain_count_ord
      - tenure_group_ord
      - recency_group_ord
      - app_count_group_ord
      - app_tenure_group_ord
      - app_recency_days_ord
      - telco_install_date
