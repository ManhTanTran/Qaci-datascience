    missing_policy: preserve_missing
  fpt_education:
    raw_columns: [has_fpt_edu, fpt_edu_year]
    transform: build_fpt_education
    required: false
    semantic_type: direct_behavior
    description: Cờ/năm giáo dục FPT nếu có trong input; không suy ra quan hệ gia đình khi thiếu.
    missing_policy: preserve_missing
