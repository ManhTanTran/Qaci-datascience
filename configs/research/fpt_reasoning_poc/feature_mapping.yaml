      - telco_monetary_min_12M
      - telco_monetary_std_12M
      - telco_monetary_sum_ALL
      - telco_monetary_mean_ALL
      - telco_monetary_max_ALL
      - telco_monetary_min_ALL
      - telco_monetary_std_ALL
