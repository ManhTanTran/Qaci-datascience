      - is_late_sum_3M
      - is_prepaid_mean_3M
      - total_late_day_sum_3M
      - total_late_day_mean_3M
      - total_late_day_max_3M
      - payment_month_count_3M
      - is_late_mean_6M
      - is_late_sum_6M
      - is_prepaid_mean_6M
      - total_late_day_sum_6M
      - total_late_day_mean_6M
      - total_late_day_max_6M
      - payment_month_count_6M
      - is_late_mean_12M
      - is_late_sum_12M
      - is_prepaid_mean_12M
      - total_late_day_sum_12M
      - total_late_day_mean_12M
      - total_late_day_max_12M
