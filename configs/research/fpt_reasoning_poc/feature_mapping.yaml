      - telco_cancel_date_year
      - telco_inbound_count_180d
      - telco_outbound_count_180d
      - telco_ticket_count_180d
      - telco_inbound_count_180d_ord
      - telco_outbound_count_180d_ord
      - telco_ticket_count_180d_ord
      - telco_internet_usage_group
      - telco_internet_trend_group
