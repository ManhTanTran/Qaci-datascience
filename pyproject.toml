[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-knowledge-base"
version = "0.1.0"
description = "Vietnamese credit scoring knowledge base"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2,<3",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<9.7",
  "PyYAML>=6",
]
modeling = [
  "lightgbm>=4",
  "optuna>=3",
]
notebook = [
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["site"]
