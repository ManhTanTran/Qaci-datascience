[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-knowledge-base"
version = "0.1.0"
description = "Vietnamese credit scoring knowledge base"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2,<3",
  "pyarrow>=14",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<9.7",
  "PyYAML>=6",
]
modeling = [
  "lightgbm>=4",
  "optuna>=3",
]
notebook = [
  "matplotlib>=3.7",
]
dc5 = [
  "catboost>=1.2",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
  "PyYAML>=6",
]
ui = [
  "streamlit>=1.36",
]
web = [
  "fastapi>=0.110",
  "openai>=1.68",
  "uvicorn[standard]>=0.29",
]
reasoning = [
  "jsonschema>=4.23,<5",
  "openai>=1.100",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
]

[project.scripts]
dc5-pipeline = "credit_scoring.dc5.pipeline:main"
dc5-ui = "credit_scoring.dc5.ui:cli_main"
dc5-admin-ui = "credit_scoring.dc5.admin_ui:cli_main"
dc5-customer-ui = "credit_scoring.dc5.customer_ui:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["site"]
