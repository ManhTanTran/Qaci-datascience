[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-knowledge-base"
version = "0.1.0"
description = "Vietnamese credit scoring knowledge base"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<9.7",
  "pytest>=8,<9",
  "ruff>=0.6",
  "PyYAML>=6",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["site"]
